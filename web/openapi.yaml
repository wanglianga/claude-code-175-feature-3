openapi: 3.0.3
info:
  title: 城市租房押金托管·退租验房·争议服务
  version: "1.0.0"
  description: |
    把**合同、押金托管、入住交割、维修记录、退租验房、扣款建议、争议申诉与押金释放**
    收敛到同一条租赁记录(contract/lease)上的后端服务。

    ## 核心一致性保证
    * 押金进入托管账户后分为三层金额:`balance`(在管余额)、`disputed_hold`(建议/争议软冻结)、
      `hard_hold`(双方确认或平台裁决后的定论预留)。
    * 验房规则引擎只**生成建议**,金额只进入 `disputed_hold`;租客逐项接受才转 `hard_hold`。
    * 租客一旦申诉,合同进入 `DISPUTING`;**存在未闭合争议时数据库触发器直接拒绝结算确认与放款**。
    * 争议闭合时资金同事务联动:裁决支持部分转 `hard_hold`,未支持部分立即解冻为可退余额。
    * 结算必须租客与房东双方确认才放款;押金台账 `fund_ledger` append-only,
      所有状态变化同时写事务性 outbox 并投递 Kafka 主题 `lease.events`(按 contract_id 分区有序)。

    ## 状态机
    `SIGNED → LIVING(押金入托管) → CHECKOUT_PENDING / EARLY_TERMINATED → INSPECTING
     → DEDUCTION_PROPOSED → DISPUTING(可循环) → RELEASED`

    ## 认证
    演示系统使用固定 Bearer Token(见 README 测试账号),生产应替换 `/api/v1/auth/login` 为密码/短信验证码登录。
servers:
  - url: http://localhost:8080
    description: 本地开发
tags:
  - name: auth
    description: 登录与会话
  - name: lease
    description: 合同 / 托管 / 交割 / 维修
  - name: inspection
    description: 退租验房与扣款建议
  - name: dispute
    description: 争议申诉、补证、协商与平台裁决
  - name: settlement
    description: 结算与押金释放
  - name: utility
    description: 退租水电尾款预留、供应商账单、读表照片复核与唯一一笔最终押金流水
  - name: admin
    description: 平台运营
  - name: ops
    description: 健康检查

paths:
  /healthz:
    get:
      tags: [ops]
      summary: 存活探针
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
  /readyz:
    get:
      tags: [ops]
      summary: 就绪探针(PostgreSQL/Redis/Kafka)
      responses:
        "200": {description: 全部依赖可用}
        "503": {description: 存在不可用依赖}

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 手机号登录换取 Bearer Token(演示)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: {type: string, example: "13800000001"}
      responses:
        "200":
          description: 会话
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  actor: {$ref: "#/components/schemas/Actor"}
        "404": {$ref: "#/components/responses/Error"}

  /api/v1/users:
    post:
      tags: [lease]
      summary: 创建用户
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, display_name, role]
              properties:
                phone: {type: string}
                display_name: {type: string}
                role: {type: string, enum: [TENANT, LANDLORD, AGENT, PLATFORM]}
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}

  /api/v1/properties:
    post:
      tags: [lease]
      summary: 房东/中介登记房源
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, city]
              properties:
                address: {type: string}
                city: {type: string}
                rooms: {type: string}
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}

  /api/v1/contracts:
    get:
      tags: [lease]
      summary: 列出与当前用户相关的合同(平台看全部)
      security: [{bearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ContractSummary"}
    post:
      tags: [lease]
      summary: 签约(房东/中介发起,合同进入 SIGNED)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignContractRequest"}
      responses:
        "201":
          description: 已签约
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, example: SIGNED}
        "403": {$ref: "#/components/responses/Error"}

  /api/v1/contracts/{id}:
    get:
      tags: [lease]
      summary: 一条租赁的完整档案(合同/托管/交割/清单/维修/验房/扣款/争议/台账/事件)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LeaseTimeline"}
        "404": {$ref: "#/components/responses/Error"}

  /api/v1/contracts/{id}/timeline:
    get:
      tags: [lease]
      summary: 同上(语义别名)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LeaseTimeline"}

  /api/v1/contracts/{id}/deposit:
    post:
      tags: [lease]
      summary: 租客把押金充入托管账户(SIGNED → LIVING)
      description: 只有租客本人可以充押金;成功后 `balance=deposit_amount`,写入 DEPOSIT_IN 台账。
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
      responses:
        "200":
          description: 已托管起租
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: LIVING}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}

  /api/v1/contracts/{id}/evidence:
    post:
      tags: [lease]
      summary: 登记证据文件元数据(照片/票据的 sha256 与存储地址)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EvidenceRequest"}
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}

  /api/v1/contracts/{id}/checkin:
    post:
      tags: [lease]
      summary: 入住交割(墙面/地板/家电清单 + 钥匙 + 水电煤读数 + 清洁)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CheckinRequest"}
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  handover_id: {type: string, format: uuid}
                  phase: {type: string, example: CHECKIN}

  /api/v1/contracts/{id}/repairs:
    post:
      tags: [lease]
      summary: 入住期间租客提交维修报修
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, category]
              properties:
                title: {type: string}
                description: {type: string}
                category: {type: string, enum: [WALL, FLOOR, APPLIANCE, FURNITURE, PLUMBING, ELECTRICAL, DOOR_WINDOW, OTHER]}
                item_name: {type: string}
                evidence_ids: {type: array, items: {type: string, format: uuid}}
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair_id: {type: string, format: uuid}
                  status: {type: string, example: SUBMITTED}

  /api/v1/contracts/{id}/repairs/{rid}/decision:
    post:
      tags: [lease]
      summary: 房东/中介确认维修责任与费用(关联房屋档案,退租时作为判定证据)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
        - {name: rid, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [LANDLORD_RESPONSIBLE, TENANT_RESPONSIBLE, SHARED, REJECTED, COMPLETED]
                cost_amount: {type: number, format: double}
                tenant_share: {type: number, format: double}
                decision_note: {type: string}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}

  /api/v1/contracts/{id}/checkout:
    post:
      tags: [lease]
      summary: 租客退租交房(可声明提前退租;提交钥匙/清洁/退租水电读数)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CheckoutRequest"}
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  handover_id: {type: string, format: uuid}

  /api/v1/contracts/{id}/inspection/start:
    post:
      tags: [inspection]
      summary: 房东/中介发起验房(合同 → INSPECTING),同时自动闭合"逾期不验房"争议
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  inspection_id: {type: string, format: uuid}
                  status: {type: string, example: OPEN}

  /api/v1/contracts/{id}/inspection/submit:
    post:
      tags: [inspection]
      summary: 提交验房六维结论,规则引擎生成扣款建议并软冻结 disputed_hold
      description: |
        六维:墙面、地板、家电、钥匙、水电、清洁。规则依据合同/入住交割基线/维修责任记录判定:
        自然磨损与入住前损坏产出 **0 元保护性建议**;家电责任不清产出 `APPLIANCE_RESPONSIBILITY_UNCLEAR`;
        提前退租按合同通知期产出空置损失建议。返回全部建议与合计金额。
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubmitInspectionRequest"}
      responses:
        "201":
          description: 已生成扣款建议,合同进入 DEDUCTION_PROPOSED
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InspectionResult"}

  /api/v1/contracts/{id}/inspection/review:
    post:
      tags: [inspection]
      summary: 租客审阅验房结论(agree=false 要求补证复验)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agree]
              properties:
                agree: {type: boolean}
                comment: {type: string}
      responses:
        "200": {description: OK}

  /api/v1/contracts/{id}/items/{itype}/{iid}/accept:
    post:
      tags: [inspection]
      summary: 租客接受某条扣款建议(disputed_hold → hard_hold)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
        - {name: itype, in: path, required: true, schema: {type: string, enum: [finding, charge]}}
        - {name: iid, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ACCEPTED}

  /api/v1/contracts/{id}/items/{itype}/{iid}/contest:
    post:
      tags: [dispute]
      summary: 租客对扣款建议申诉(打开争议,合同 → DISPUTING,款项留在 disputed_hold)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
        - {name: itype, in: path, required: true, schema: {type: string, enum: [finding, charge]}}
        - {name: iid, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum:
                    - WALL_DAMAGE_VS_WEAR
                    - FLOOR_DAMAGE_VS_WEAR
                    - APPLIANCE_RESPONSIBILITY
                    - UTILITY_ARREARS
                    - KEY_LOSS
                    - INSPECTION_DELAY
                    - EARLY_TERMINATION
                    - CLEANING_FEE
                    - UTILITY_FINAL_SETTLEMENT
                    - OTHER
                subject: {type: string}
                comment: {type: string}
                evidence_ids: {type: array, items: {type: string, format: uuid}}
      responses:
        "201":
          description: 争议已打开
          content:
            application/json:
              schema:
                type: object
                properties:
                  dispute_id: {type: string, format: uuid}
                  status: {type: string, example: OPEN}

  /api/v1/contracts/{id}/disputes/inspection-delay:
    post:
      tags: [dispute]
      summary: 租客就房东超过合同期限迟迟不验房提起争议
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: {type: string}
      responses:
        "201":
          description: 逾期争议成立
          content:
            application/json:
              schema:
                type: object
                properties:
                  dispute_id: {type: string, format: uuid}
                  reason: {type: string, example: INSPECTION_DELAY}
        "400":
          description: 尚未超过合同约定的验房期限
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409": {$ref: "#/components/responses/Error"}

  /api/v1/contracts/{id}/disputes:
    get:
      tags: [dispute]
      summary: 列出本租赁全部争议与时间线动作
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Dispute"}}
                  actions: {type: array, items: {$ref: "#/components/schemas/DisputeAction"}}

  /api/v1/contracts/{id}/disputes/{did}/actions:
    post:
      tags: [dispute]
      summary: |
        争议动作:补证 SUBMIT_EVIDENCE / 房东回应 ACKNOWLEDGE·REBUT /
        平台要求补证 REQUEST_MORE_EVIDENCE / 撤回 WITHDRAW /
        双方协商 PARTIES_AGREE(带 amount) / 升级 ESCALATE / 平台裁决 ADJUDICATE(带 amount)。
        闭合争议时同事务完成资金联动与扣款项终态。
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
        - {name: did, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum:
                    - SUBMIT_EVIDENCE
                    - ACKNOWLEDGE
                    - REBUT
                    - REQUEST_MORE_EVIDENCE
                    - WITHDRAW
                    - PARTIES_AGREE
                    - ESCALATE
                    - ADJUDICATE
                amount:
                  type: number
                  format: double
                  description: PARTIES_AGREE/ADJUDICATE 时"支持房东"的金额(0=全额驳回)
                comment: {type: string}
                deadline_days: {type: integer, description: REQUEST_MORE_EVIDENCE 补证期限}
                evidence_ids: {type: array, items: {type: string, format: uuid}}
      responses:
        "200": {description: 动作成功}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}

  /api/v1/contracts/{id}/settlement/propose:
    post:
      tags: [settlement]
      summary: 生成/刷新结算单(扣款=hard_hold,退还=balance-hard_hold)
      description: 仍存在 disputed_hold(待确认/争议中款项)时返回 409 UNRESOLVED_DISPUTE。
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string}
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  settlement_id: {type: string, format: uuid}
                  status: {type: string, example: PROPOSED}
        "409": {$ref: "#/components/responses/Error"}

  /api/v1/contracts/{id}/settlement/confirm:
    post:
      tags: [settlement]
      summary: 租客/房东确认结算;双方都确认后原子放款(房东收扣款,租客收余额)
      description: |
        单方确认只记录不释放;双方确认时数据库 settlement_guard 触发器再次校验
        **无未闭合争议且金额等于 hard_hold**,通过后同事务执行 DEDUCT + RELEASE_TO_TENANT,
        合同进入 RELEASED。
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
      responses:
        "200": {description: 确认成功(双方齐备则已放款)}
        "409":
          description: 存在未闭合争议 / 金额不一致 / 状态不允许
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/contracts/{id}/utility-reservation:
    post:
      tags: [utility]
      summary: 租客搬离、最后一期账单未出时预留部分押金(房东/中介/平台)
      description: |
        依据最近表计读数与历史用量自动估算(或使用 reserved_amount 显式指定),
        从当前未被占用的押金余额中预留, 资金进入 `hard_hold`, 追加 `UTILITY_RESERVE` 台账。
        响应/timeline 向双方展示**预留原因**与**预计结算时间**。一份合同至多一笔预留(409)。
        已存在预留时, 验房规则引擎不再生成 UTILITY_ARREARS 扣款建议(防双重扣款)。
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateUtilityReservationRequest"}
      responses:
        "201":
          description: 预留已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservation_id: {type: string, format: uuid}
                  status: {type: string, example: RESERVED}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}

  /api/v1/contracts/{id}/utility-reservation/{rid}/bills:
    post:
      tags: [utility]
      summary: 登记供应商最后一期账单(bill_no 幂等去重, 重复账单绝不扣款)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
        - {name: rid, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubmitSupplierBillRequest"}
      responses:
        "200":
          description: 同一 bill_no 重复上传 -> 幂等返回原账单, 无资金动作
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill_id: {type: string, format: uuid}
                  duplicated: {type: boolean, example: true}
                  message: {type: string}
        "201":
          description: 新账单已登记; 若租客已补传照片则预留进入 REVIEW_PENDING(必须交叉复核)
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill_id: {type: string, format: uuid}
                  duplicated: {type: boolean, example: false}
        "409": {$ref: "#/components/responses/Error"}

  /api/v1/contracts/{id}/utility-reservation/{rid}/meter-photos:
    post:
      tags: [utility]
      summary: 租客补传搬离当天水表/电表照片读数(最终结算前不扣款)
      description: |
        照片先走 `/evidence`(category=UTILITY) 登记, 再提交读数。同种类表重复补传只保留最新版
        (旧读数 superseded 留痕)。账单已到时预留自动转 REVIEW_PENDING: **平台必须把照片读数与
        供应商账单放一起复核, 不能只按账单金额扣款**。已最终结算后补传返回 409, 不产生扣款。
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
        - {name: rid, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubmitMeterPhotosRequest"}
      responses:
        "200": {description: 照片读数已登记(重复提交幂等成功)}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}

  /api/v1/contracts/{id}/utility-reservation/{rid}/review:
    post:
      tags: [utility]
      summary: 平台把照片读数与供应商账单逐项交叉复核(仅平台)
      description: |
        * MATCH — 照片与账单读数对得上, 按账单金额;
        * ADOPT_PHOTO — 采用照片读数×单价重算(账单读表有误), 核定金额回写账单 settled_amount;
        * UNMATCHABLE — 读数无法对应(表号/期间不一致), 预留转 MANUAL_REVIEW(READING_UNMATCHABLE)。
        可通过 amount_overrides 逐项拍板。无照片时不允许复核(直接按账单 finalize 即可)。
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
        - {name: rid, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReviewMeterRequest"}
      responses:
        "200":
          description: 复核完成, 预留回到 BILL_RECEIVED(以核定金额); 或转人工复核
          content:
            application/json:
              schema:
                type: object
                properties:
                  meter_review_id: {type: string, format: uuid}
                  decision: {type: string, enum: [MATCH, ADOPT_PHOTO, UNMATCHABLE]}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}

  /api/v1/contracts/{id}/utility-reservation/{rid}/dispute:
    post:
      tags: [utility]
      summary: 任一方就水电尾款费用分摊/读数提起争议(预留转 MANUAL_REVIEW 保持待处理)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
        - {name: rid, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: {type: string}
      responses:
        "201":
          description: 争议打开(UTILITY_FINAL_SETTLEMENT), 预留保持待处理
          content:
            application/json:
              schema:
                type: object
                properties:
                  dispute_id: {type: string, format: uuid}
                  reason: {type: string, example: UTILITY_FINAL_SETTLEMENT}
                  status: {type: string, example: MANUAL_REVIEW}
        "409": {$ref: "#/components/responses/Error"}

  /api/v1/contracts/{id}/utility-reservation/{rid}/manual-resolve:
    post:
      tags: [utility]
      summary: 平台结束人工复核恢复可结算(账单延迟可传 settled_amount 核定, 自动补平台核定单)
      description: |
        账单延迟(BILL_DELAYED)、读数无法对应(READING_UNMATCHABLE)或分摊争议(ALLOCATION_DISPUTE)
        期间预留保持 MANUAL_REVIEW。平台处理完毕后调用 RESUME; 分摊争议必须先在争议流程闭合。
        供应商始终不出账时可提供 settled_amount, 系统自动生成一张平台核定账单作为结算凭据。
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
        - {name: rid, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResolveUtilityManualRequest"}
      responses:
        "200":
          description: 已恢复到 BILL_RECEIVED
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: BILL_RECEIVED}
        "409": {$ref: "#/components/responses/Error"}

  /api/v1/contracts/{id}/utility-reservation/{rid}/finalize:
    post:
      tags: [utility]
      summary: 最终结算——只生成一笔最终押金流水(多退少补), 重复调用/重复账单/补传照片均幂等
      description: |
        以账单核定金额(settled_amount ?? total_amount)为准:
        `from_deposit=MIN(charge,reserved)` 从预留支付给供应商/房东;
        `refund=reserved-from_deposit` 退还租客; `supplement=MAX(charge-reserved,0)` 向租客发起补缴。
        台账仅追加两笔 UTILITY_FINAL_SETTLE(支付+退款, 金额为 0 的方向省略), 预留转 SETTLED。
        之后再收账单、再补照片或再次调用都只返回同一结果, **不会重复扣款**; 托管账户与最终结果
        在同一事务勾稽。状态非 BILL_RECEIVED / 有未闭合争议时 409(数据库触发器兜底)。
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
        - {name: rid, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string}
      responses:
        "200":
          description: 幂等返回已有最终结算(未重复扣款)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UtilityFinalResult"}
        "201":
          description: 已生成唯一一笔最终押金流水
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UtilityFinalResult"}
        "409": {$ref: "#/components/responses/Error"}

  /api/v1/contracts/{id}/utility-supplements/{sid}/pay:
    post:
      tags: [utility]
      summary: 租客支付水电尾款补缴(实际费用超出预留部分; 不经托管, 重复支付幂等)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ContractId"}
        - {name: sid, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: 补缴已结清(或此前已支付, 幂等)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: PAID}
        "409": {$ref: "#/components/responses/Error"}

  /api/v1/admin/utility-bill-delay:
    post:
      tags: [admin]
      summary: "平台巡检: 超过预计出账时间仍未收到账单的预留转 MANUAL_REVIEW(BILL_DELAYED)"
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  manual_review:
                    type: array
                    items: {type: string, format: uuid}

  /api/v1/admin/overdue-inspections:
    post:
      tags: [admin]
      summary: 平台巡检:为超过验房期限仍未验房的合同自动代开验房(仅平台)
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  opened:
                    type: array
                    items: {type: string, format: uuid}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ContractId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Error:
      description: 业务错误
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          enum: [NOT_FOUND, VALIDATION, CONFLICT, BAD_STATE, UNRESOLVED_DISPUTE, FORBIDDEN, UNAUTHORIZED, INTERNAL]
        message: {type: string}
    Actor:
      type: object
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [TENANT, LANDLORD, AGENT, PLATFORM]}
        name: {type: string}
    ContractSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        lease_no: {type: string}
        status: {type: string}
        tenant_id: {type: string, format: uuid}
        landlord_id: {type: string, format: uuid}
        deposit_amount: {type: number}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
    SignContractRequest:
      type: object
      required: [property_id, tenant_id, start_date, end_date, rent_amount, deposit_amount]
      properties:
        property_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        agent_id: {type: string, format: uuid}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        rent_amount: {type: number, format: double}
        deposit_amount: {type: number, format: double}
        wear_clause: {type: string, description: 合同中的自然磨损约定}
        notice_days: {type: integer, default: 30, description: 提前退租通知期}
        inspection_due_days: {type: integer, default: 7, description: 交房后房东须完成验房的天数}
        payment_due_days: {type: integer, default: 7}
        lease_no: {type: string}
    EvidenceRequest:
      type: object
      required: [category, sha256, storage_uri]
      properties:
        category:
          type: string
          enum: [HANDOVER_CHECKIN, HANDOVER_CHECKOUT, INSPECTION, REPAIR, DISPUTE, INVOICE, KEY, UTILITY, CLEANING, OTHER]
        content_type: {type: string, default: image/jpeg}
        sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        size_bytes: {type: integer, format: int64}
        storage_uri: {type: string}
        caption: {type: string}
    MeterReading:
      type: object
      required: [kind, reading]
      properties:
        kind: {type: string, enum: [WATER, ELECTRIC, GAS]}
        reading: {type: number}
        unit_price: {type: number}
    InventoryItem:
      type: object
      required: [name, category, checkin_state]
      properties:
        name: {type: string}
        category: {type: string, enum: [WALL, FLOOR, DOOR_WINDOW, FURNITURE, APPLIANCE, KEY, FIXTURE, OTHER]}
        brand_model: {type: string}
        checkin_state: {type: string, enum: [NEW, GOOD, WORN, DAMAGED, MISSING]}
        checkin_note: {type: string}
    CheckinRequest:
      type: object
      properties:
        water_meter_reading: {type: number}
        elec_meter_reading: {type: number}
        gas_meter_reading: {type: number}
        keys_handover: {type: string}
        cleaning_note: {type: string}
        note: {type: string}
        evidence_ids: {type: array, items: {type: string, format: uuid}}
        inventory: {type: array, items: {$ref: "#/components/schemas/InventoryItem"}}
        meters: {type: array, items: {$ref: "#/components/schemas/MeterReading"}}
    CheckoutRequest:
      type: object
      properties:
        water_meter_reading: {type: number}
        elec_meter_reading: {type: number}
        gas_meter_reading: {type: number}
        keys_returned: {type: string}
        cleaning_note: {type: string}
        note: {type: string}
        early: {type: boolean, description: 是否提前退租}
        evidence_ids: {type: array, items: {type: string, format: uuid}}
        meters: {type: array, items: {$ref: "#/components/schemas/MeterReading"}}
    SubmitInspectionRequest:
      type: object
      required: [wall_status, floor_status, appliance_status, keys_status, utility_status, cleaning_status]
      properties:
        wall_status: {type: string, enum: [GOOD, NORMAL_WEAR, DAMAGED]}
        floor_status: {type: string, enum: [GOOD, NORMAL_WEAR, DAMAGED]}
        appliance_status: {type: string, enum: [GOOD, NORMAL_WEAR, DAMAGED, MISSING]}
        keys_status: {type: string, enum: [RETURNED, MISSING, DAMAGED]}
        utility_status: {type: string, enum: [SETTLED, UNPAID]}
        cleaning_status: {type: string, enum: [CLEAN, NEEDS_CLEANING]}
        summary: {type: string}
        wall_repair_fee: {type: number}
        floor_repair_fee: {type: number}
        appliance_fee: {type: number}
        key_replacement_fee: {type: number}
        cleaning_fee: {type: number}
        evidence_ids: {type: array, items: {type: string, format: uuid}}
    Suggestion:
      type: object
      properties:
        code: {type: string}
        title: {type: string}
        detail: {type: string}
        basis: {type: string}
        linked_repair_id: {type: string}
        amount: {type: number}
        deductible: {type: boolean}
    ChargeSuggestion:
      type: object
      properties:
        code: {type: string}
        title: {type: string}
        detail: {type: string}
        basis: {type: string}
        amount: {type: number}
    InspectionResult:
      type: object
      properties:
        status: {type: string, example: DEDUCTION_PROPOSED}
        deductible_total: {type: number}
        facts: {type: array, items: {$ref: "#/components/schemas/Suggestion"}}
        charges: {type: array, items: {$ref: "#/components/schemas/ChargeSuggestion"}}
        notes: {type: array, items: {type: string}}
    Dispute:
      type: object
      properties:
        id: {type: string, format: uuid}
        reason: {type: string}
        subject: {type: string}
        claimed_amount: {type: number}
        status: {type: string, enum: [OPEN, EVIDENCE_PENDING, UNDER_REVIEW, RESOLVED_AGREEMENT, RESOLVED_ADJUDICATION, WITHDRAWN]}
        award_to_landlord: {type: number}
        award_to_tenant: {type: number}
        resolution_note: {type: string}
        created_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time}
    DisputeAction:
      type: object
      properties:
        id: {type: integer}
        action:
          type: string
          enum: [OPEN, SUBMIT_EVIDENCE, ACKNOWLEDGE, REBUT, REQUEST_MORE_EVIDENCE, PARTIES_AGREE, ESCALATE, ADJUDICATE, WITHDRAW]
        amount_effect: {type: number}
        comment: {type: string}
        created_at: {type: string, format: date-time}
    LeaseTimeline:
      type: object
      properties:
        contract: {type: object}
        escrow: {type: object}
        handovers: {type: array, items: {type: object}}
        inventory: {type: array, items: {type: object}}
        repairs: {type: array, items: {type: object}}
        inspection: {type: object}
        findings: {type: array, items: {type: object}}
        charges: {type: array, items: {type: object}}
        disputes: {type: array, items: {$ref: "#/components/schemas/Dispute"}}
        settlement: {type: object}
        utility_reservation: {$ref: "#/components/schemas/UtilityReservationView"}
        fund_ledger: {type: array, items: {type: object}}
        events: {type: array, items: {type: object}}
        dispute_actions: {type: array, items: {$ref: "#/components/schemas/DisputeAction"}}
        open_disputes: {type: integer}
        available_to_release: {type: number}
    CreateUtilityReservationRequest:
      type: object
      properties:
        reserved_amount:
          type: number
          format: double
          description: 显式预留金额; 为 0 时按最近读数与历史月均用量自动估算(预留 2 个月月均)
        reason: {type: string, description: 预留原因(留空使用系统生成的标准化说明)}
        expected_settle_days: {type: integer, default: 14, description: 预计结算时间(天数)}
        bill_due_days: {type: integer, description: 供应商预计出账时间(天数, 默认同预计结算)}
        note: {type: string}
    UtilityBillLine:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [WATER, ELECTRIC, GAS]}
        start_reading: {type: number}
        end_reading: {type: number}
        usage: {type: number}
        unit_price: {type: number}
        amount: {type: number}
    SubmitSupplierBillRequest:
      type: object
      required: [bill_no]
      properties:
        bill_no: {type: string, description: 供应商账单号(同合同内唯一, 重复上传幂等不扣款)}
        supplier: {type: string}
        bill_period_start: {type: string, format: date}
        bill_period_end: {type: string, format: date}
        line_items: {type: array, items: {$ref: "#/components/schemas/UtilityBillLine"}}
        total_amount: {type: number, description: 留空时按 line_items.amount 汇总}
        evidence_ids: {type: array, items: {type: string, format: uuid}}
        note: {type: string}
    MeterPhoto:
      type: object
      required: [kind, reading, evidence_id]
      properties:
        kind: {type: string, enum: [WATER, ELECTRIC, GAS]}
        reading: {type: number, description: 搬离当天表计读数}
        evidence_id: {type: string, format: uuid, description: 已登记的 UTILITY 类证据 id}
        taken_at: {type: string, format: date-time, description: 照片拍摄时间(搬离当天)}
        note: {type: string}
    SubmitMeterPhotosRequest:
      type: object
      required: [photos]
      properties:
        photos: {type: array, items: {$ref: "#/components/schemas/MeterPhoto"}}
        note: {type: string}
    ReviewMeterRequest:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [MATCH, ADOPT_PHOTO, UNMATCHABLE]}
        amount_overrides:
          type: object
          additionalProperties: {type: number}
          description: '平台逐项拍板金额, 如 {"WATER": 55.00}(优先于照片/账单重算)'
        note: {type: string}
    ResolveUtilityManualRequest:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [RESUME]}
        settled_amount:
          type: number
          description: 账单延迟供应商始终不出账时, 平台核定金额(自动生成平台核定账单)
        note: {type: string}
    UtilityFinalResult:
      type: object
      properties:
        final_settlement_id: {type: string, format: uuid}
        reservation_id: {type: string, format: uuid}
        bill_id: {type: string, format: uuid}
        idempotent: {type: boolean, description: true=重复调用返回既有结果, 未产生新扣款}
        reserved_amount: {type: number}
        charge_total: {type: number, description: 复核/核定后的实际费用}
        from_deposit: {type: number, description: 从预留押金支付部分 = MIN(charge,reserved)}
        refund_to_tenant: {type: number, description: 退回租客的多余预留}
        supplement_amount: {type: number, description: 不足部分, 向租客发起补缴}
        supplement_id: {type: string, format: uuid}
        settle_kind: {type: string, enum: [REVIEW_CROSS_CHECK, BILL_ONLY, MANUAL_ADJUDICATED]}
        status: {type: string, example: SETTLED}
    UtilityReservationView:
      type: object
      description: timeline 中向租客房东双方展示的预留全貌(原因/预计结算时间/账单/照片/复核/最终结果)
      properties:
        reservation:
          type: object
          properties:
            id: {type: string, format: uuid}
            status: {type: string, enum: [RESERVED, BILL_RECEIVED, REVIEW_PENDING, MANUAL_REVIEW, SETTLED]}
            reserved_amount: {type: number}
            estimate_breakdown: {type: array, items: {type: object}}
            reason: {type: string}
            expected_settle_at: {type: string, format: date-time}
            bill_due_at: {type: string, format: date-time}
            bill_overdue: {type: boolean}
            manual_reason: {type: string, enum: [BILL_DELAYED, READING_UNMATCHABLE, ALLOCATION_DISPUTE]}
        bills: {type: array, items: {type: object}}
        meter_photos: {type: array, items: {type: object}}
        meter_reviews: {type: array, items: {type: object}}
        final_settlement: {$ref: "#/components/schemas/UtilityFinalResult"}
        supplement: {type: object}
